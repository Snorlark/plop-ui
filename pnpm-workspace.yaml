packages:
  - packages/*
  - apps/*

# Only these dependencies may run install scripts (esbuild downloads its native binary).
allowBuilds:
  esbuild: true


# Security patches for transitive dev/build dependencies (Dependabot alerts), kept within each package's major.
overrides:
  "postcss@<8.5.23": "^8.5.23"
  "uuid@<11.1.1": "^11.1.1"
