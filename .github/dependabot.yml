# Keeps the SHA-pinned GitHub Actions in ci.yml and release.yml up to date: one grouped PR a month,
# into main so it runs the full CI gate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
