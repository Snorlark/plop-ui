# Keeps the SHA-pinned GitHub Actions in ci.yml and release.yml up to date: one grouped PR a month,
# into main so it runs the full CI gate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v2 renames every input and output release.yml uses and moves to Changesets v3; upgrade it by hand.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
