name: CI

# Runs only what a change needs (scripts/ci-changes.mjs decides; docs/ci-cd.md explains), in parallel,
# behind one required check: the `ci` job at the bottom.
#
# - pull_request: classified by the changed files (components and site code: all 5 browsers;
#   docs text: desktop + phone; changelogs: site build; notes: changeset status).
# - workflow_dispatch on changeset-release/main: started by the Release workflow for the bot's
#   version PR (GitHub doesn't run CI for PRs the bot opens). Version bumps only: site build.
# - push to main: a small check after each merge (quick checks + desktop).
# - schedule (Mondays) and workflow_dispatch on main: everything.

on:
  pull_request:
    # Only PRs into main (a release): work merges into dev freely, without CI, to save Actions minutes.
    branches: [main]
    # ready_for_review: a draft tests Chrome and Android only; marking it ready runs every browser.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# A new push to a PR cancels its older run. Every other run gets its own group (run_id), so a merge or the
# Monday run never cancels another run on main, even a pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads: the token can't push, comment or touch releases, even on a run from main.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.classify.outputs.check }}
      build_apps: ${{ steps.classify.outputs.build_apps }}
      site: ${{ steps.classify.outputs.site }}
      e2e: ${{ steps.classify.outputs.e2e }}
      projects: ${{ steps.classify.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: classify
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && 'HEAD~1' || 'origin/main') }}
        run: node scripts/ci-changes.mjs --base "$BASE"

  check:
    needs: changes
    if: needs.changes.outputs.check != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `changeset status` compares against main
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - if: needs.changes.outputs.check == 'changeset'
        # A PR checkout has origin/main but no local main, which `changeset status` would look for.
        run: pnpm changeset status --since=origin/${{ github.base_ref || 'main' }}
      # The docs site is built once, by build-site, whenever that job runs.
      - if: needs.changes.outputs.check == 'full'
        run: >-
          pnpm turbo run build --filter=./packages/*
          ${{ needs.changes.outputs.build_apps == 'true' && '--filter=@plop-ui/storybook --filter=@plop-ui/dispatch-demo' || '' }}
          ${{ needs.changes.outputs.site != 'true' && '--filter=@plop-ui/docs' || '' }}
      - if: needs.changes.outputs.check == 'full'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm size

  build-site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./packages/*
      - run: pnpm --filter @plop-ui/docs build
        env:
          NEXT_DIST_DIR: .next-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-build
          retention-days: 1
          # .next-e2e is a dot-folder; upload-artifact skips those unless asked.
          include-hidden-files: true
          path: |
            apps/docs/.next-e2e
            !apps/docs/.next-e2e/cache
            packages/*/dist

  e2e:
    needs: [changes, build-site]
    if: needs.changes.outputs.e2e != 'none' && needs.build-site.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    # One job per browser engine (chromium: desktop + phone, firefox, webkit: safari + iphone), so each installs once.
    name: e2e (${{ matrix.project.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-build
      - id: pw
        run: echo "version=$(node -p "require('./apps/docs/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.project.browser }}
      # Only this job's browser; on a cache hit only its system libraries.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @plop-ui/docs exec playwright install --with-deps ${{ matrix.project.browser }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @plop-ui/docs exec playwright install-deps ${{ matrix.project.browser }}
      - run: pnpm --filter @plop-ui/docs exec playwright test --project=${{ join(matrix.project.projects, ' --project=') }}
        env:
          NEXT_DIST_DIR: .next-e2e

  # The one required check. Skipped jobs are fine (that change didn't need them); failed or cancelled ones are not.
  ci:
    needs: [changes, check, build-site, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CHECK: ${{ needs.changes.outputs.check }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # No classification means nothing was decided, so nothing may be called tested.
          [ -n "$CHECK" ] || { echo "changes wrote no outputs"; exit 1; }
          bad=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          [ "$bad" = "0" ]
