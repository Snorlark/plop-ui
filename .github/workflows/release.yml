name: Release

# Releases @plop-ui/tokens, @plop-ui/fonts and @plop-ui/react to npm (staged, with provenance).
#
# On every push to main, the Changesets action does one of two things:
# - pending changesets in .changeset/: it opens (or updates) a "Version packages" PR that bumps versions and
#   writes the CHANGELOG.md files. Merging that PR is how you cut a release.
# - no pending changesets: it stages any version that isn't on npm yet, then pushes the git tags.
#   Staged versions go live only when a maintainer approves them on npmjs.com with 2FA.
# It can also be started by hand from the Actions tab.
#
# Needs: trusted publishing set up on npm for each package (owner Snorlark, repo plop-ui, workflow release.yml),
# and Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests". No npm token.
# The trusted publishers allow `npm stage publish` only (leave "Allow npm publish" unticked).
# Staging itself is scripts/publish.mjs (pnpm packs, npm 11 stages), not `changeset publish`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version packages" PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
