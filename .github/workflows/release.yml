name: Release

# Releases @plop-ui/tokens, @plop-ui/fonts and @plop-ui/react to npm (staged; with provenance while the repo is public).
#
# On every push to main, the Changesets action does one of two things:
# - pending changesets in .changeset/: it opens (or updates) a "Version packages" PR that bumps versions and
#   writes the CHANGELOG.md files. Merging that PR is how you cut a release.
# - no pending changesets: it stages any version that isn't on npm yet, then pushes the git tags.
#   Staged versions go live only when a maintainer approves them on npmjs.com with 2FA.
# It can also be started by hand from the Actions tab.
#
# GitHub doesn't run CI for PRs the bot opens, so after opening or updating the version PR this workflow starts
# ci.yml on changeset-release/main itself (workflow_dispatch is allowed from GITHUB_TOKEN). That gives the PR its
# required `ci` check; a version-bump-only PR just builds the site. Tests aren't run here: every change already
# passed the `ci` gate on its PR (see docs/ci-cd.md).
#
# Needs: trusted publishing set up on npm for each package (owner Snorlark, repo plop-ui, workflow release.yml),
# and Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests". No npm token.
# The trusted publishers allow `npm stage publish` only (leave "Allow npm publish" unticked).
# Staging itself is scripts/publish.mjs (pnpm packs, npm 11 stages), not `changeset publish`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version packages" PR
  actions: write # start CI on the version PR
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm only accepts provenance from public repos, so it follows the repo's visibility.
          NPM_PROVENANCE: ${{ !github.event.repository.private }}
      - if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
