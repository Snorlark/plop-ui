name: Bug report
description: Something in a component or on plopui.com doesn't work or doesn't look right.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or page
      placeholder: "Select, or https://plopui.com/playground"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Poster, Cutting mat, Notebook, Kraft, Riso, Not sure]
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark]
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: "Safari 18 on iOS 18"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@plop-ui/react 0.4.0"
  - type: checkboxes
    id: motion
    attributes:
      label: Accessibility settings
      options:
        - label: Reduced motion was on
        - label: I was using a keyboard or screen reader
  - type: textarea
    id: repro
    attributes:
      label: Screenshot or code
      description: A screenshot, a short clip, or the smallest code sample that shows the bug.
