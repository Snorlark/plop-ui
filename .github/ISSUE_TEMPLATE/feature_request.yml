name: Idea or new component
description: Suggest a component, a prop, or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The screen or the moment where PlopUI falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The component or prop you have in mind, and roughly how it would look or behave.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (see CONTRIBUTING.md)
